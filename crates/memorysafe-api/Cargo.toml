[package]
name = "memorysafe-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP API for the MemorySafe governed-memory engine"

[dependencies]
memorysafe-auth.workspace = true
# `Page` (backend-level pagination), consumed directly by the review route.
memorysafe-backend.workspace = true
memorysafe-core.workspace = true
memorysafe-engine.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
memorysafe-backend-sqlite.workspace = true
memorysafe-embed.workspace = true
# Only the test harness (`tests/support/mod.rs`) constructs a
# `BaselinePolicy` to build an `Engine`; no route handler in `src/` depends
# on a concrete policy.
memorysafe-policy.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower.workspace = true

[lints]
workspace = true
