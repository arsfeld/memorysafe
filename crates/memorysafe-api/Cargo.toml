[package]
name = "memorysafe-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP API for the MemorySafe governed-memory engine"

[dependencies]
memorysafe-auth.workspace = true
# `Page` (backend-level pagination), consumed directly by the review route.
memorysafe-backend.workspace = true
memorysafe-core.workspace = true
memorysafe-engine.workspace = true
# `BaselineConfig`: `Engine::tenant_settings`/`set_tenant_policy_config`
# (`memorysafe-engine`) type the tenant policy configuration as this concrete
# struct, not a trait object, so the admin policy routes (`src/admin.rs`)
# serialize and deserialize it directly. Not the same exception as the
# workspace's "no concrete backend" rule (Global Constraints) — that rule is
# about `memorysafe-backend-sqlite`/`rusqlite`; `memorysafe-policy` is the
# crate that already defines the type this adapter's wire format is.
memorysafe-policy.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
memorysafe-backend-sqlite.workspace = true
memorysafe-embed.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower.workspace = true

[lints]
workspace = true
