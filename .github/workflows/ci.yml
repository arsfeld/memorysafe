name: ci
on: [push, pull_request]
env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --workspace
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: The five correctness invariants
        run: cargo test -p memorysafe-engine --test invariants --release
        env:
          PROPTEST_CASES: 64
  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      # `memorysafe-policy` IS in the loop now: the crate exists (Task 25), so
      # naming it checks something. It was previously named here and held out
      # deliberately, because a nonexistent crate reports a GREEN PASS rather
      # than an error — see the capture below, which is what makes that
      # impossible.
      - name: memorysafe-core and memorysafe-policy must have no I/O dependencies
        run: |
          for c in memorysafe-core memorysafe-policy; do
            # Capture first. Piping `cargo tree` straight into `grep` throws its
            # exit status away: the pipeline takes grep's, and grep's "no match"
            # 1 short-circuits the `&& exit 1` so the echo runs. `set -o pipefail`
            # does not help — it returns the RIGHTMOST non-zero status, which is
            # grep's 1, indistinguishable from a genuine no-match. So any tool
            # failure, not only a missing package, would report a pass it never
            # performed.
            out=$(cargo tree -p "$c" --edges normal --prefix none) \
              || { echo "cargo tree failed for $c"; exit 1; }
            printf '%s\n' "$out" \
              | grep -Ei '^(tokio|rusqlite|sqlx|reqwest|hyper|hf-hub|ureq) ' && exit 1
            echo "$c is I/O free"
          done
      # The structural half of "No LLM and no network call in the write path".
      # `model2vec-rs` is taken with default-features = false and features
      # ["onig", "local-only"]; without local-only, `from_pretrained` on a
      # missing path falls back to a HuggingFace Hub request. The behavioural
      # guard for that is `a_missing_model_path_is_unavailable_not_a_panic`,
      # which lives behind the `model2vec` feature and therefore does not run
      # unless --all-features links — so this dependency check is the only
      # thing that notices if the feature list is edited. Do not delete it as
      # redundant with the test; the test is the one that is conditional.
      - name: memorysafe-embed must reach no network stack, with every feature on
        run: |
          out=$(cargo tree -p memorysafe-embed --all-features --edges normal --prefix none) \
            || { echo "cargo tree failed for memorysafe-embed"; exit 1; }
          printf '%s\n' "$out" \
            | grep -Ei '^(reqwest|hyper|hf-hub|ureq|native-tls|rustls) ' && exit 1
          echo "embed reaches no network stack under --all-features"
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      # Global Constraints: adapters depend on `memorysafe-engine`, never on a
      # concrete backend. `memorysafe-cli` is the composition root and is
      # exempt — it is the one crate allowed to pick a backend.
      #
      # This checks the *normal* dependency graph, not the manifest text: a
      # plain grep of Cargo.toml would show "sqlite present" for every crate
      # whose tests happen to depend on `memorysafe-backend-sqlite` (a
      # legitimate dev-dependency) and prove nothing about whether the
      # library code itself can reach a concrete backend.
      #
      # Capture first, same reasoning as the purity job above: piping
      # `cargo tree` straight into `grep` throws its exit status away and can
      # report a pass the check never performed.
      - name: memorysafe-mcp and memorysafe-api must not reach past the engine into a backend
        run: |
          for c in memorysafe-mcp memorysafe-api; do
            out=$(cargo tree -p "$c" --edges normal --prefix none) \
              || { echo "cargo tree failed for $c"; exit 1; }
            printf '%s\n' "$out" \
              | grep -Ei '^(memorysafe-backend-sqlite|rusqlite|sqlx) ' && exit 1
            echo "$c is backend-free"
          done
      - name: memorysafe-auth must stay transport free
        run: |
          out=$(cargo tree -p memorysafe-auth --edges normal --prefix none) \
            || { echo "cargo tree failed for memorysafe-auth"; exit 1; }
          printf '%s\n' "$out" \
            | grep -Ei '^(tokio|axum|rmcp|rusqlite) ' && exit 1
          echo "memorysafe-auth is transport free"
